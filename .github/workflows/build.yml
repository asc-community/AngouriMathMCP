name: build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -c Release src/AngouriMath.Mcp

      # The suite runs here as of AngouriMath 2.0.0. It could not before: CI has no sibling
      # checkout, so it builds against the released package, and on 1.4.0 several assertions
      # in test/smoke.sh failed legitimately — integrating x*ln(x) overflowed the stack
      # there, and the limit of (1+x)^(1/x) answered 1 instead of e. Red meant "a different
      # library", not "a defect in this repo", which is worse than no signal. 2.0.0 is the
      # branch these tests were written against, and both suites were confirmed green
      # against the package before this was switched on.
      - run: ./test/smoke.sh
      - run: src/AngouriMath.Mcp/bin/Release/net10.0/angourimath-mcp --selftest
